[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-leonida-intelligence"
version = "1.0.0"
description = "GitHub intelligence monitor for Project Leonida and independent mapping sources"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
leonida-monitor = "leonida_monitor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
